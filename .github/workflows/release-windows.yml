name: Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write  # create GitHub Release and upload assets
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,build]"

      - name: Test
        run: pytest -q

      - name: Build
        run: python scripts/build_release.py --os windows --clean

      - uses: actions/upload-artifact@v4
        with:
          name: ClickbaitParser-windows-x64
          path: dist/release/ClickbaitParser-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/ClickbaitParser-windows-x64.zip
          generate_release_notes: true
